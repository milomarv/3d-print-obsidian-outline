[project]
name = "print-outline"
version = "0.1.0"
description = "Auto-generates Obsidian _index.md files for a 3D-printing project vault. Idempotent, fence-protected, Spoolman-aware."
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6",
]

[project.scripts]
outline = "print_outline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/print_outline"]

[dependency-groups]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D1",    # pydocstyle — missing docstring rules (D100–D107); D2xx/D3xx/D4xx still enforced when a docstring exists
  "D203",  # conflicts with D211 — D211 (no blank line before class docstring) wins
  "D213",  # conflicts with D212 — D212 (multi-line summary on first line) wins
]

[tool.ruff.lint.per-file-ignores]
# pytest's primary assertion is bare `assert`; S101 doesn't apply to test files.
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
